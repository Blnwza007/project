<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คิดให้ไววิ่งให้ทัน — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background">
    <img src="../picture/Cloud.png" alt="" id="cloud-left" width="280">
    <img src="../picture/Cloud.png" alt="" id="cloud-right" width="280">
    <img src="../picture/sun.png"   alt="" id="sun" width="200">
  </div>

  <div class="run">
    <img src="../picture/teacher.png" alt="" id="chaserRun" width="120" style="position:absolute; display:none;">
    <img src="../picture/boy_running1.png" alt="" id="boyRun"  width="350" style="display:none;">
    <img src="../picture/girl_running.png" alt="" id="girlRun" width="80">
  </div>

  <header class="hud">
    <a href="../Home/index.html" class="home-btn" id="homeBtn" title="กลับหน้าหลัก">
      <svg class="home-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="home-btn-text" id="homeBtnText">หน้าหลัก</span>
    </a>
    <div class="hud-block">
      <span class="hud-label" id="hudLabelLevel">LEVEL</span>
      <span class="hud-value" id="tierDisplay">1</span>
    </div>
    <div class="hud-block center">
      <span class="hud-label" id="hudLabelScore">คะแนน</span>
      <span class="hud-value gold" id="scoreDisplay">0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label" id="hudLabelHearts">ชีวิต</span>
      <div id="heartsDisplay" class="hearts">
        <span class="heart">
          <svg class="heart-svg" viewBox="0 0 24 24" width="24" height="24" fill="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#FF2A2A" stroke="#000" stroke-width="2" stroke-linejoin="round"/><path d="M7 6c-1.5 0-2.5 1-2.5 2.5" stroke="#FFF" stroke-width="1.2" stroke-linecap="round"/></svg>
        </span>
        <span class="heart">
          <svg class="heart-svg" viewBox="0 0 24 24" width="24" height="24" fill="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#FF2A2A" stroke="#000" stroke-width="2" stroke-linejoin="round"/><path d="M7 6c-1.5 0-2.5 1-2.5 2.5" stroke="#FFF" stroke-width="1.2" stroke-linecap="round"/></svg>
        </span>
        <span class="heart">
          <svg class="heart-svg" viewBox="0 0 24 24" width="24" height="24" fill="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#FF2A2A" stroke="#000" stroke-width="2" stroke-linejoin="round"/><path d="M7 6c-1.5 0-2.5 1-2.5 2.5" stroke="#FFF" stroke-width="1.2" stroke-linecap="round"/></svg>
        </span>
      </div>
    </div>
  </header>

  <main class="play-container">

    <div id="bossEntity" class="boss-img hidden"><img src="../picture/teacher.png" alt=""></div>

    <!-- Boss Countdown Overlay -->
    <div id="bossCountdown" class="boss-countdown hidden">
      <div class="boss-countdown-bg" id="bossCountdownBg"></div>
      <div class="boss-countdown-content">
        <div class="boss-countdown-num" id="bossCountdownNum">3</div>
        <div class="boss-countdown-label" id="bossCountdownLabel"></div>
      </div>
    </div>

    <!-- Boss Taunt Bubble -->
    <div id="bossTaunt" class="boss-taunt hidden">
      <span id="bossTauntText"></span>
    </div>


    <div class="streak-wrap" id="streakWrap" style="display:none;">
      <span class="streak-fire">
        <svg class="fire-svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
          <path d="M12 2C10.5 5 7 8 7 12c0 3 2.5 5.5 5 8 2.5-2.5 5-5 5-8 0-4-3.5-7-5-10z" fill="#FF3D00" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M12 8c-1 2-2.5 4-2.5 6 0 1.5 1 2.5 2.5 4 1.5-1.5 2.5-2.5 2.5-4 0-2-1.5-4-2.5-6z" fill="#FFD600"/>
        </svg>
      </span>
      <span class="streak-text" id="streakText">ตอบถูก 3 ข้อติดต่อกัน</span>
    </div>

    <div class="timer-wrap">
      <div class="timer-bar-outer">
        <div class="timer-bar-inner" id="timerBar"></div>
      </div>
      <span class="timer-text" id="timerText">30</span>
    </div>

    <div class="question-card" id="questionCard">
      <div class="q-tier-badge" id="tierBadge">LEVEL 1</div>
      <div class="question-text" id="questionDisplay">กำลังโหลดโจทย์...</div>
    </div>

    <div class="answer-wrap">
      <input
        type="text"
        id="answerInput"
        class="answer-input"
        placeholder="พิมพ์คำตอบ..."
        autocomplete="off"
      >
      <button id="submitAnswer" class="mainbtn submit-btn">ส่งคำตอบ ▶</button>
    </div>

    <div class="feedback" id="feedback"></div>

  </main>

  <!-- ── GAME OVER overlay ── -->
  <div class="overlay hidden" id="gameOverScreen">
    <div class="over-card">
      <div class="over-emoji" id="overEmoji">
        <svg class="over-skull-icon" viewBox="0 0 40 40" width="64" height="64" fill="none">
          <path d="M8 18C8 10.5 13.5 5 20 5s12 5.5 12 13c0 5-2.5 9-5 11v6H13v-6c-2.5-2-5-6-5-11z" fill="#ECEFF1" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="14" cy="17" r="3.5" fill="#263238"/>
          <circle cx="26" cy="17" r="3.5" fill="#263238"/>
          <path d="M20 21l-1.5 3h3L20 21z" fill="#263238"/>
          <path d="M16 29v6M20 29v6M24 29v6" stroke="#000" stroke-width="2"/>
          <path d="M15 8l3 5" stroke="#B0BEC5" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 class="over-title" id="overTitle">Game Over!</h2>
      <div class="result-row">
        <span class="r-label" id="overLabelScore">คะแนน</span>
        <span class="r-val gold" id="finalScore">0</span>
      </div>
      <div class="result-row">
        <span class="r-label" id="overLabelCorrect">ตอบถูก</span>
        <span class="r-val green" id="finalCorrect">0</span>
      </div>
      <div class="result-row">
        <span class="r-label" id="overLabelLevel">ถึง Level</span>
        <span class="r-val" id="finalTier">1</span>
      </div>
      <div class="over-btns">
        <button id="restartBtn" class="mainbtn">เล่นอีกครั้ง</button>
        <a href="../Home/index.html" id="menuLink"><button id="menuBtn" class="mainbtn secondary" >หน้าหลัก</button></a>
      </div>
    </div>
  </div>

  <script type="module" src="./questions.js?v=5"></script>
  <script type="module" src="./script.js?v=5"></script>
</body>
</html>
