<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่า – คิดให้ไววิ่งให้ทัน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background decoration -->
  <div class="background">
    <img src="../../picture/Cloud.png" alt="" id="cloud-left" width="280">
    <img src="../../picture/Cloud.png" alt="" id="cloud-right" width="280">
    <img src="../../picture/sun.png" alt="" id="sun" width="200">
  </div>

  <!-- Running character -->
  <div class="run">
    <img src="../../picture/boy_running1.png" alt="" id="boyRun" width="350" style="display:none;">
    <img src="../../picture/girl_running.png" alt="" id="girlRun" width="100">
  </div>

  <main class="container">
    <!-- Panel -->
    <div class="panel">

      <!-- Panel header -->
      <div class="panel-header">
        <h1 id="txt-header-title">ตั้งค่า</h1>
        <h2>SETTINGS</h2>
      </div>

      
      <nav class="tabs-nav">
        <button class="tab-btn active" data-target="tab-name" id="tab-btn-name">ชื่อผู้เล่น</button>
        <button class="tab-btn" data-target="tab-char" id="tab-btn-char">ตัวละคร</button>
        <button class="tab-btn" data-target="tab-lang" id="tab-btn-lang">ภาษา</button>
      </nav>

      <div class="panel-body">
        
        <section id="tab-name" class="tab-content active">
          <div class="section-label">
            <span class="label-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC700" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <span class="label-text" id="lbl-name">ชื่อผู้เล่น</span>
            <span class="label-en">PLAYER NAME</span>
          </div>
          <div class="input-row">
            <input
              type="text"
              id="player-name"
              class="pixel-input"
              maxlength="16"
              placeholder="ใส่ชื่อที่นี่..."
              autocomplete="off"
            >
            <button class="icon-btn" id="clear-name-btn" title="ลบชื่อ" aria-label="ลบชื่อ">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="char-count"><span id="name-count">0</span>/16</div>
        </section>

        <section id="tab-char" class="tab-content">
          <div class="section-label">
            <span class="label-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFC700">
                <circle cx="13.5" cy="5.5" r="2.5"/>
                <path d="M9 13.5l2-3 2 1.5V17h2v-6l-2-2-1.5 1-2.5-1.5L6 11l1.5 1.5L9 11v2.5z"/>
                <path d="M11 17l-3 5h2.5l2-3.5L14 20h2.5l-2.5-4.5z"/>
              </svg>
            </span>
            <span class="label-text" id="lbl-char">ตัวละคร</span>
            <span class="label-en">CHARACTER</span>
          </div>
          <div class="character-grid">
            <button class="char-card selected" data-char="girl" id="char-girl">
              <div class="char-preview">
                <img src="../../picture/girl_running.png" alt="girl" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <span class="char-fallback" style="display:none">GIRL</span>
              </div>
              <span class="char-name" id="txt-char-girl">หญิง</span>
              <span class="char-name-en">GIRL</span>
              <div class="selected-badge">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#d85718" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
            </button>
            <button class="char-card" data-char="boy" id="char-boy">
              <div class="char-preview">
                <img src="../../picture/boy_running1.png" alt="boy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="char-fallback" style="display:none;">BOY</span>
              </div>
              <span class="char-name" id="txt-char-boy">ชาย</span>
              <span class="char-name-en">BOY</span>
              <div class="selected-badge">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#d85718" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
            </button>
          </div>
        </section>

        
        <section id="tab-lang" class="tab-content">
          <div class="section-label">
            <span class="label-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC700" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </span>
            <span class="label-text" id="lbl-lang">ภาษา</span>
            <span class="label-en">LANGUAGE</span>
          </div>
          <div class="lang-row">
            <button class="lang-btn selected" data-lang="th" id="lang-th">
              <span class="lang-flag">
                <svg class="flag-svg" viewBox="0 0 30 20" width="22" height="15">
                  <rect width="30" height="20" fill="#ED1C24"/>
                  <rect y="3.33" width="30" height="13.34" fill="#FFF"/>
                  <rect y="6.67" width="30" height="6.66" fill="#241D4F"/>
                </svg>
              </span>
              <span>ภาษาไทย</span>
            </button>
            <button class="lang-btn" data-lang="en" id="lang-en">
              <span class="lang-flag">
                <svg class="flag-svg" viewBox="0 0 30 20" width="22" height="15">
                  <clipPath id="uk-clip"><rect width="30" height="20"/></clipPath>
                  <g clip-path="url(#uk-clip)">
                    <rect width="30" height="20" fill="#012169"/>
                    <path d="M0 0 L30 20 M30 0 L0 20" stroke="#FFF" stroke-width="4"/>
                    <path d="M0 0 L30 20 M30 0 L0 20" stroke="#C8102E" stroke-width="2"/>
                    <path d="M15 0 v20 M0 10 h30" stroke="#FFF" stroke-width="6"/>
                    <path d="M15 0 v20 M0 10 h30" stroke="#C8102E" stroke-width="3.5"/>
                  </g>
                </svg>
              </span>
              <span>English</span>
            </button>
          </div>
        </section>
      </div>

      <div class="divider"></div>

      <!-- ── Buttons ── -->
      <div class="action-row">
        <a href="../index.html" class="mainbtn back-btn" id="btn-back">← กลับ</a>
        <button class="mainbtn save-btn" id="save-btn">บันทึก</button>
      </div>

      <!-- Save toast -->
      <div class="toast" id="toast">บันทึกแล้ว!</div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
